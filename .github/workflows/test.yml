name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Test std
        run: cargo test

      - name: Test no-std
        run: cargo test --no-default-features

      # Check that benchmarks compile without running them
      - name: Check bench
        run: cargo check --bench benches
